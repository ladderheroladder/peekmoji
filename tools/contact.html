<!doctype html>
<meta charset="utf-8">
<title>Timescope photo check</title>
<style>
body{margin:8px;font:12px system-ui;background:#111;color:#eee}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
figure{margin:0}img{width:100%;height:150px;object-fit:contain;background:#222;display:block}
figcaption{padding:2px 0}
</style>
<div class="grid" id="g"></div>
<script src="../timescope/photos.js"></script>
<script>
document.getElementById('g').innerHTML = TIMESCOPE_PHOTOS.map((p, i) =>
  `<figure><img src="../timescope/${p.src}"><figcaption>${i + 1}. ${p.id}</figcaption></figure>`).join('');
</script>
